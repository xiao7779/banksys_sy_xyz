name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            DEPLOY_DIR="/opt/banksys-sy"
            APP="banksys-sy"
            PORT_START=8888
            PORT_END=8895

            # ===== 1. 同步代码 =====
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # 首次需要 clone，后续拉取更新
            if [ ! -d ".git" ]; then
              git clone https://github.com/xiao7779/banksys_sy_xyz.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            # ===== 2. 构建镜像 =====
            docker build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple -t "$APP":latest .

            # ===== 3. 端口探测：从 PORT_START 开始找空闲端口 =====
            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }

            PORT=""
            for p in $(seq $PORT_START $PORT_END); do
              if ! port_in_use "$p"; then PORT="$p"; break; fi
            done
            [ -z "$PORT" ] && { echo "预留端口区间已全部占用，部署中止"; exit 1; }
            echo ">> 部署到主机端口 $PORT"

            # ===== 4. 启动容器 =====
            docker rm -f "$APP" 2>/dev/null || true
            docker run -d --name "$APP" --restart unless-stopped -p "${PORT}:8888" "$APP":latest
            sleep 5

            # ===== 5. 健康检查 =====
            curl -fsS --max-time 10 "http://localhost:${PORT}/"
            echo ""
            echo ">> 部署成功: http://$(hostname -I | awk '{print $1}'):${PORT}"
